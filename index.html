<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0d0f12" />
    <title>IRONLOG</title>

    <!-- SEO + social link previews -->
    <meta name="description" content="IRONLOG — log workouts, track calories & macros, and watch your strength trend. Free, synced across devices. Try the demo, no sign-in needed." />
    <link rel="canonical" href="https://lokoto-ironlog.fly.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IRONLOG" />
    <meta property="og:title" content="IRONLOG — your gym and your kitchen, in one app" />
    <meta property="og:description" content="Log workouts with PR detection and 1RM trends, track macros with barcode scanning. Try the demo — no sign-in." />
    <meta property="og:url" content="https://lokoto-ironlog.fly.dev/" />
    <meta property="og:image" content="https://lokoto-ironlog.fly.dev/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA: installable, full-screen, themed -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.png" />

    <!-- iOS "Add to Home Screen" -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IRONLOG" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Google Identity Services (GIS) — the current "Sign in with Google" client.
         This is the only Google auth script we load; no legacy platform.js/gapi. -->
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
